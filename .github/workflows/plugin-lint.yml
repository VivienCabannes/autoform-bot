name: plugin-lint

# Static, dependency-free lint of the plugin's markdown/JSON/TOML surface.
# Runs only when something on that surface changes.
on:
  push:
    paths:
      - "agents/**"
      - "skills/**"
      - "commands/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "packaging/muse/**"
      - ".mcp.json"
      - "hooks/hooks.json"
      - "hooks/**"
      - "scripts/lint_plugin.py"
      - "scripts/service_control.py"
      - "scripts/build_muse_plugin.py"
      - "servers/run-muse-server.sh"
      - "tests/test_muse_plugin.py"
      - "scripts/check_invariants.py"
      - ".github/workflows/plugin-lint.yml"
  pull_request:
    paths:
      - "agents/**"
      - "skills/**"
      - "commands/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "packaging/muse/**"
      - ".mcp.json"
      - "hooks/hooks.json"
      - "hooks/**"
      - "scripts/lint_plugin.py"
      - "scripts/service_control.py"
      - "scripts/build_muse_plugin.py"
      - "servers/run-muse-server.sh"
      - "tests/test_muse_plugin.py"
      - "scripts/check_invariants.py"
      - ".github/workflows/plugin-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Compile-check the deterministic scripts (stdlib only — no install step).
      - name: Byte-compile scripts
        run: |
          python -m py_compile scripts/lint_plugin.py
          python -m py_compile scripts/build_muse_plugin.py
          python -m py_compile scripts/backend_config.py
          python -m py_compile scripts/install_host_agents.py
          python -m py_compile scripts/init_plan.py
          python -m py_compile scripts/provider_check.py
          python -m py_compile scripts/service_control.py
          if [ -f scripts/check_invariants.py ]; then
            python -m py_compile scripts/check_invariants.py
          fi

      # The plugin linter: frontmatter, marketplace/plugin JSON, references,
      # dangling-reference guard.
      - name: Lint plugin
        run: python scripts/lint_plugin.py
