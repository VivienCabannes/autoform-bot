name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install test environment
        run: uv sync --extra dev --extra zulip
      - name: Run unit tests
        run: uv run python -m pytest -q
      - name: Run workspace fixture
        run: make demo PYTHON="uv run python"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install quality environment
        run: uv sync --extra dev --extra zulip
      - name: Lint Python surfaces
        run: make lint
      - name: Lint plugin surfaces
        run: python3 scripts/lint_plugin.py
      - name: Validate bundled Markdown blueprint
        run: make check-blueprint-example
      - name: Reject whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
