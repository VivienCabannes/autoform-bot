# This workflow gives the auto-merge gate something real to check. Without at
# least one successful check on a PR head the worker refuses to merge (an empty
# check rollup is `none`, not `success`), so a project that wants autonomous
# merging needs this — or an equivalent build check of its own.
#
# It verifies on neutral hardware exactly what the local prover gate verifies:
# the project builds, no `sorry`/`admit` survives, and no unexpected axiom was
# introduced. Actions are pinned by full SHA.

name: autoform verify

on:
  pull_request:
  push:
    branches: [__DEFAULT_BRANCH__]

permissions:
  contents: read

concurrency:
  group: autoform-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get || echo "no cache available — building from source"

      - name: Build
        run: lake build

      - name: Reject sorry, admit, and unsafe elaboration
        run: |
          set -euo pipefail
          # Comments and strings are stripped before scanning so prose that
          # merely mentions `sorry` does not fail the build.
          python3 - <<'PY'
          import pathlib, re, sys

          BLOCK = re.compile(r"/-.*?-/", re.DOTALL)
          LINE = re.compile(r"--.*?$", re.MULTILINE)
          STRING = re.compile(r'"(?:[^"\\]|\\.)*"', re.DOTALL)
          FORBIDDEN = re.compile(r"\b(sorry|admit|sorryAx)\b|\bset_option\s+\S*(unsafe|skipKernelTC)\S*\s+true")

          bad = []
          for path in pathlib.Path(".").rglob("*.lean"):
              if ".lake" in path.parts:
                  continue
              src = path.read_text(encoding="utf-8", errors="replace")
              stripped = STRING.sub('""', LINE.sub("", BLOCK.sub("", src)))
              for match in FORBIDDEN.finditer(stripped):
                  line = stripped[: match.start()].count("\n") + 1
                  bad.append(f"{path}:{line}: {match.group(0)}")
          if bad:
              print("Incomplete or unsafe Lean found:", file=sys.stderr)
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print("no sorry/admit/unsafe elaboration found")
          PY

      - name: Audit axioms
        run: |
          set -euo pipefail
          # Any axiom beyond Lean's three classical foundations is a soundness
          # signal: it means something was assumed rather than proved.
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          ALLOWED = {"propext", "Classical.choice", "Quot.sound"}
          DECL = re.compile(r"^\s*(?:@\[[^\]]*\]\s*)?(?:private\s+|protected\s+|noncomputable\s+)*"
                            r"(?:theorem|lemma)\s+([A-Za-z_][A-Za-z0-9_.']*)", re.MULTILINE)

          modules, names = [], []
          for path in sorted(pathlib.Path(".").rglob("*.lean")):
              if ".lake" in path.parts or path.name.startswith("lakefile"):
                  continue
              src = path.read_text(encoding="utf-8", errors="replace")
              found = DECL.findall(src)
              if not found:
                  continue
              modules.append(".".join(path.with_suffix("").parts))
              names.extend(found)
          if not names:
              print("no theorems to audit")
              sys.exit(0)

          probe = "\n".join(f"import {m}" for m in dict.fromkeys(modules))
          probe += "\n" + "\n".join(f"#print axioms {n}" for n in dict.fromkeys(names)) + "\n"
          pathlib.Path("autoform_axiom_probe.lean").write_text(probe, encoding="utf-8")

          out = subprocess.run(["lake", "env", "lean", "autoform_axiom_probe.lean"],
                               capture_output=True, text=True)
          print(out.stdout)
          if out.returncode != 0:
              print(out.stderr, file=sys.stderr)
              sys.exit("axiom probe failed to elaborate")

          seen = set()
          for match in re.finditer(r"depends on axioms: \[([^\]]*)\]", out.stdout):
              seen.update(a.strip() for a in match.group(1).split(",") if a.strip())
          extra = sorted(seen - ALLOWED)
          if extra:
              sys.exit(f"unexpected axioms introduced: {', '.join(extra)}")
          print(f"axioms clean ({len(seen)} standard axiom(s) in use)")
          PY
