name: Autoform Pages

on:
  push:
    branches: [__DEFAULT_BRANCH__]
    paths:
__WATCH_PATHS__
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check out pinned Autoform exporter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: __AUTOFORM_REPOSITORY__
          ref: __AUTOFORM_REVISION__
          path: .autoform-tooling

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"

      - name: Validate Markdown article graph
        run: >-
          uv run --directory .autoform-tooling autoform-blueprint check
          "$GITHUB_WORKSPACE/__BLUEPRINT_PATH__" --lean-root "$GITHUB_WORKSPACE"

      - name: Render book, progress, and dependency views
        run: >-
          uv run --directory .autoform-tooling autoform-blueprint render
          "$GITHUB_WORKSPACE/__BLUEPRINT_PATH__"
          --output "$GITHUB_WORKSPACE/site-src"
          --lean-root "$GITHUB_WORKSPACE"
          --require-declarations

      - name: Build static site
        run: >-
          uvx --from mkdocs==1.6.1 --with pymdown-extensions==10.21.3
          mkdocs build --strict --config-file "$GITHUB_WORKSPACE/mkdocs.yml"
          --site-dir "$GITHUB_WORKSPACE/__SITE_PATH__"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: "__SITE_PATH__"

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
