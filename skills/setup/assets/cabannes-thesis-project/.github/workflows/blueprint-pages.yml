name: Blueprint Pages

on:
  push:
    branches: [main]
    paths:
      - "blueprint/**"
      - "mkdocs.yml"
      - ".github/workflows/blueprint-pages.yml"
  pull_request:
    paths:
      - "blueprint/**"
      - "mkdocs.yml"
      - ".github/workflows/blueprint-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Validate the theorem DAG
        run: >-
          uvx --from git+https://github.com/VivienCabannes/autoform-bot.git@c3e0ba4059359f4a309d18f6c75b344264deec38
          autoform check blueprint

      - name: Generate the dependency graph
        run: >-
          uvx --from git+https://github.com/VivienCabannes/autoform-bot.git@c3e0ba4059359f4a309d18f6c75b344264deec38
          autoform-visualize blueprint
          --output blueprint/dependencies.html
          --link-extension .html

      - name: Build the Markdown site
        run: >-
          uvx --from mkdocs==1.6.1
          --with pymdown-extensions==10.21.3
          mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
