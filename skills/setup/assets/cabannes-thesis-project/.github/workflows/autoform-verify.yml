# Builds the Lean project and validates its Autoform blueprint on neutral
# hardware. Actions and the Autoform source are pinned immutably.

name: autoform verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: autoform-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Validate the theorem DAG
        run: >-
          uvx --from git+https://github.com/VivienCabannes/autoform-bot.git@c3e0ba4059359f4a309d18f6c75b344264deec38
          autoform-blueprint check blueprint

      - name: Install elan
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o elan.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz" \
            | sha256sum --check --strict
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Reject kernel-check bypass options
        run: |
          set -euo pipefail
          # Scan all tracked text, including Lake configuration. Keep the
          # forbidden token split so this checker does not match itself.
          forbidden="skip""KernelTC"
          if matches="$(git grep -n -I "$forbidden" -- .)"; then
            printf 'Kernel-check bypass option found:\n%s\n' "$matches" >&2
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              echo "failed to scan tracked files" >&2
              exit "$grep_status"
            fi
          fi
          echo "no kernel-check bypass option found"

      - name: Fetch the Mathlib build cache
        run: lake exe cache get || echo "no cache available — building from source"

      - name: Build Lean
        run: lake build

      - name: Audit every project declaration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          modules = []
          for path in sorted(pathlib.Path(".").rglob("*.lean")):
              if (
                  ".lake" in path.parts
                  or path.name.startswith("lakefile")
                  or path.name == "autoform_axiom_probe.lean"
              ):
                  continue
              modules.append(".".join(path.with_suffix("").parts))
          if not modules:
              print("no Lean modules to audit")
              sys.exit(0)

          modules = list(dict.fromkeys(modules))
          imports = "\n".join(f"import {module}" for module in modules)

          def lean_name(module):
              result = "Name.anonymous"
              for part in module.split("."):
                  result = f"Name.str ({result}) {json.dumps(part)}"
              return result

          target_modules = ", ".join(lean_name(module) for module in modules)
          probe = imports + "\nimport Lean.Util.CollectAxioms\nimport Lean.Elab.Command\n\n" + f'''\
          open Lean Elab Command

          run_cmd do
            let targetModules : List Name := [{target_modules}]
            let allowed : List Name := [``propext, ``Classical.choice, ``Quot.sound]
            let env ← getEnv
            let mut checked : Nat := 0
            let mut badSafety : Array Name := #[]
            let mut badAxioms : Array (Name × Name) := #[]
            for (declName, info) in env.constants do
              if let some moduleIdx := env.getModuleIdxFor? declName then
                let moduleName := env.header.moduleNames[moduleIdx.toNat]!
                if targetModules.contains moduleName then
                  checked := checked + 1
                  if info.isUnsafe || info.isPartial then
                    badSafety := badSafety.push declName
                  for usedAxiom in (← Lean.collectAxioms declName) do
                    unless allowed.contains usedAxiom do
                      badAxioms := badAxioms.push (declName, usedAxiom)
            for declName in badSafety do
              logError m!"unsafe or partial declaration: {{declName}}"
            for (declName, usedAxiom) in badAxioms do
              logError m!"{{declName}} depends on unexpected axiom {{usedAxiom}}"
            unless badSafety.isEmpty && badAxioms.isEmpty do
              throwError "project declarations failed the kernel-trust audit"
            logInfo m!"kernel trust clean ({{checked}} project declaration(s) audited)"
          '''
          pathlib.Path("autoform_axiom_probe.lean").write_text(probe, encoding="utf-8")

          result = subprocess.run(
              ["lake", "env", "lean", "autoform_axiom_probe.lean"],
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          if result.returncode != 0:
              print(result.stderr, file=sys.stderr)
              sys.exit("axiom probe failed to elaborate")
          PY
