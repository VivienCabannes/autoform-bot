site_name: Cabannes thesis formalization
# A project's own repository, never AutoformBot's. Setup fills this in.
repo_url: https://github.com/VivienCabannes/cabannes-thesis

# `autoform render` writes this directory from blueprint/. The vault stays the
# source of truth; everything here is regenerated.
docs_dir: site-src
site_dir: site
use_directory_urls: false

# Keep the primary site navigation project-independent. book.md is the same
# material as the chapter pages in one scroll, so it is published and linked
# from the contents page rather than competing with them here. The Blueprint page
# gets its chapter links from the Markdown vault; Progress and Dependencies are
# generated by Autoform.
nav:
  - Blueprint: README.md
  - Progress: progress.md
  - Dependencies: dependencies.md

theme:
  name: material
  custom_dir: theme
  font:
    text: Merriweather
    code: Source Code Pro
  icon:
    repo: fontawesome/brands/github
  features:
    # The chapter tree stays visible, which is what makes a blueprint readable
    # as a book rather than as a pile of pages.
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
  palette:
    # Dark is the default; the toggle and the OS preference both still work.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode

plugins:
  - search

markdown_extensions:
  - attr_list
  # Statement boxes carry h6 note headings; keep them out of the TOC.
  - toc:
      toc_depth: 2-3
  - md_in_html          # lets the generated statement boxes contain Markdown
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - stylesheets/blueprint.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - javascripts/blueprint-mermaid.js
