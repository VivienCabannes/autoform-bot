[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoform"
version = "0.6.1"
description = "Turn any AI coding assistant into a Lean 4 formalization agent"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "aristotlelib>=2.0",
    "fastmcp>=0.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
zulip = [
    "zulip>=0.9.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
autoform = "autoform_worker.cli:cli_main"
autoform-blueprint = "autoform_cli.__main__:main"
autoform-visualize = "autoform_cli.visualize:main"
autoform-lean-runtime = "servers.lean_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["autoform_cli", "servers", "autoform_worker"]

[tool.ruff]
line-length = 120
