[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoform"
version = "0.2.0"
description = "Turn any AI coding assistant into a Lean 4 formalization agent"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
repl = [
    "psutil>=5.9",
]
aristotle = [
    "aristotlelib>=2.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["autoform", "servers", "visualization", "scripts"]
exclude = ["scripts/.lake", "scripts/.lake/**"]

[tool.ruff]
line-length = 120
