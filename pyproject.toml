[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoform"
version = "0.4.4"
description = "Markdown-wiki planning with Lean LSP and REPL servers"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.5,<4",
    "psutil>=5.9",
]

[project.scripts]
autoform = "autoform.__main__:main"
autoform-visualize = "visualization.export_graph:main"
autoform-lean-runtime = "servers.lean_runtime:main"

[project.optional-dependencies]
# Kept as an empty compatibility extra for existing plugin launch commands.
repl = []
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["autoform", "servers", "visualization"]

[tool.ruff]
line-length = 120
