[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoform"
version = "0.4.4"
description = "Markdown-wiki planning with Lean LSP and REPL servers"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4",
]

[project.scripts]
autoform = "autoform.__main__:main"
autoform-visualize = "visualization.export_graph:main"

[project.optional-dependencies]
repl = [
    "psutil>=5.9",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["autoform", "servers", "visualization"]

[tool.ruff]
line-length = 120
