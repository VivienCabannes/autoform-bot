[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autoform"
version = "0.6.1"
description = "Turn any AI coding assistant into a Lean 4 formalization agent"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "aristotlelib>=2.0",
    "fastmcp>=0.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
zulip = [
    "zulip>=0.9.0",
]
dev = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocs-literate-nav>=0.6,<1",
    "pymdown-extensions>=10,<11",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
autoform = "autoform_cli.__main__:main"
autoform-worker = "autoform_worker.cli:cli_main"
autoform-visualize = "autoform_cli.visualize:main"

[tool.hatch.build.targets.wheel]
packages = ["autoform_cli", "servers", "autoform_worker"]

[tool.ruff]
line-length = 120
