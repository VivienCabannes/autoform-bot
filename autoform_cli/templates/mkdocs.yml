site_name: {{PROJECT_TITLE}}
repo_url: {{REPO_URL}}

# `autoform render` writes this directory from blueprint/. The vault stays the
# source of truth; everything here is regenerated.
docs_dir: site-src
site_dir: site
use_directory_urls: false

# Keep the primary site navigation project-independent. book.md is the same
# material as the chapter pages in one scroll, so it is published and linked
# from the contents page rather than competing with them here. The Blueprint page
# gets its chapter links from the Markdown vault; Progress and Dependencies are
# generated by Autoform.
nav:
  - Blueprint: README.md
  - Progress: progress.md
  - Dependencies: dependencies.md

theme:
  name: mkdocs
  # Global navigation stays identical on every page; Blueprint reading order
  # is rendered at the bottom of book pages instead.
  custom_dir: theme
  # Without this the banner is Bootstrap's primary blue; the blog's is quiet.
  nav_style: light
  # Drives the data-bs-theme attribute the generated stylesheet keys off.
  color_mode: auto
  user_color_mode_toggle: true

markdown_extensions:
  - attr_list
  - md_in_html          # lets the generated statement boxes contain Markdown
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  # Same faces as the Lean community blog.
  - https://fonts.googleapis.com/css2?family=Merriweather:wght@400;500;700&family=Open+Sans:wght@400;600&family=Source+Code+Pro:wght@400;600&display=swap
  - stylesheets/blueprint.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
  - javascripts/blueprint-mermaid.js
